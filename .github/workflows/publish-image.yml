name: Publish image

# Publishes ghcr.io/<owner>/agentic-search so a deploy -- and a rollback -- is
# "run this sha- tag" rather than "check out and rebuild" (docs/deploy.md).
#
# - main: only after the CI workflow succeeded, and only the commit CI tested
#   (workflow_run.head_sha), never the moving branch tip.
# - v* tags: a release is an explicit human act, so the tag itself is built.
# - never from a pull request: there is no pull_request trigger.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  # One native leg per platform (no QEMU): each pushes an untagged image by
  # digest; `merge` then publishes one multi-arch manifest per tag.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: >-
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      # One platform failing must not cancel the other's diagnostics; `merge`
      # still needs every leg, so a missing platform never publishes.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Platform pair for artifact and cache names
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          # A tag push carries no workflow_run payload, so fall back to its sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentic-search
          # The revision label names the commit CI tested. The default reads
          # github.sha -- for workflow_run, the branch tip when the publish
          # starts. Not `context: git`: it fails on the detached HEAD a
          # head_sha checkout leaves. A custom label overrides the default.
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/agentic-search,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentic-search
          # sha-<full sha> is the immutable deploy/rollback handle, and it names
          # the commit CI tested: type=sha would read github.sha, which for
          # workflow_run is the branch tip when the publish starts -- a merge
          # landing meanwhile would mis-tag this image. `main` is a moving
          # convenience tag -- never roll back to it. Version tags come from
          # vX.Y.Z git tags.
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-search
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-search
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

name: Renovate

# Self-hosted Renovate: opens dependency-update PRs against this repository
# using the policy in renovate.json (see docs/development/dependency-updates.md).

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

# Renovate writes through RENOVATE_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so Renovate
      # PRs would never run CI. Fail loudly instead of falling back to it.
      - name: Require RENOVATE_TOKEN
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "$RENOVATE_TOKEN" ]; then
            echo "::error::Repository secret RENOVATE_TOKEN is not set. See docs/development/dependency-updates.md."
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.167.7
        # No configurationFile: Renovate reads renovate.json from the default
        # branch as the repository config, so a policy change takes effect on
        # the first run after it merges.
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
          # The action mounts /tmp into the container, so the next step can read this.
          RENOVATE_LOG_FILE: /tmp/renovate/log.ndjson
          RENOVATE_LOG_FILE_LEVEL: info

      # Renovate exits 0 when a run goes wrong in ways that matter here:
      # - it cannot push a branch: one WARN per branch. A token without
      #   Contents write produced a green run that opened nothing;
      # - it aborts the repository: an INFO "Repository finished" whose result
      #   is not "done". A failed commit-status POST aborted every run after its
      #   first branch push, as "repository-changed".
      # Fail on those and on any ERROR. Other WARNs are only surfaced, since
      # lookups warn on transient registry trouble.
      - name: Fail on branch or repository errors
        if: ${{ !cancelled() }}
        run: |
          python3 - /tmp/renovate/log.ndjson <<'EOF'
          import json, sys

          FATAL_WARNINGS = {"Error updating branch"}
          try:
              lines = open(sys.argv[1]).read().splitlines()
          except FileNotFoundError:
              print("::error::Renovate wrote no log file; cannot tell whether the run worked.")
              sys.exit(1)

          failures = 0
          results = []
          for line in lines:
              rec = json.loads(line)
              msg = rec.get("msg", "")
              if msg == "Repository finished":
                  results.append(rec.get("result"))
              where = rec.get("branch") or rec.get("repository") or ""
              text = f"{msg} {where}".strip()
              if rec.get("level", 0) >= 50 or msg in FATAL_WARNINGS:
                  failures += 1
                  print(f"::error::{text}")
              elif rec.get("level", 0) >= 40:
                  print(f"::warning::{text}")

          if results != ["done"]:
              failures += 1
              print(f"::error::Renovate did not finish the repository: result {results or 'missing'}")
          sys.exit(1 if failures else 0)
          EOF

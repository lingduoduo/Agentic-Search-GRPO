name: Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  retrieval-eval-gate:
    name: Retrieval Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check baseline exists
        id: check
        run: |
          if [ -f data/eval/baseline_metrics.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report gate status
        run: |
          if [ "${{ steps.check.outputs.exists }}" != "true" ]; then
            msg="Retrieval eval gate INACTIVE: no data/eval/baseline_metrics.json committed (see docs/training-and-evaluation.md)."
            echo "::warning title=Eval gate inactive::$msg"
            echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          pip install -e .
          pip install -r requirements.txt

      - name: Run retrieval eval
        if: steps.check.outputs.exists == 'true'
        env:
          BM25_INDEX_PATH: ${{ secrets.BM25_INDEX_PATH }}
          BM25_CORPUS_PATH: data/corpus.jsonl
          RETRIEVAL_BACKEND: local
        run: |
          python -m src.internal.retrieval.eval_runner \
            --dataset data/eval/qa_pairs.jsonl \
            --top_k 10 \
            --output /tmp/current_metrics.json

      - name: Check for regressions
        if: steps.check.outputs.exists == 'true'
        run: |
          python - <<'EOF'
          import json, os, sys
          baseline = json.load(open("data/eval/baseline_metrics.json"))
          current  = json.load(open("/tmp/current_metrics.json"))

          gated = ["recall@10", "ndcg@10"]
          if all((baseline.get(k) or 0) == 0 for k in gated):
              msg = (
                  "Retrieval eval gate INACTIVE: baseline is a zero placeholder; "
                  "not enforcing regressions (see docs/training-and-evaluation.md)."
              )
              print(f"::warning title=Eval gate inactive::{msg}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  open(summary, "a").write(f"⚠️ {msg}\n")

          failures = []
          for key, threshold in [("recall@10", 0.02), ("ndcg@10", 0.01)]:
              base_val = baseline.get(key)
              curr_val = current.get(key)
              if base_val is None or curr_val is None:
                  continue
              drop = base_val - curr_val
              if drop > threshold:
                  failures.append(
                      f"{key}: dropped {drop:.4f} (baseline={base_val:.4f}, current={curr_val:.4f})"
                  )

          if failures:
              print("EVAL REGRESSION DETECTED:")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          else:
              print("No regressions. current:", json.dumps(current, indent=2))
          EOF

  ragas-eval-gate:
    name: RAGAS Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check baseline exists
        id: check
        run: |
          if [ -f data/eval/ragas_baseline.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report gate status
        run: |
          if [ "${{ steps.check.outputs.exists }}" != "true" ]; then
            msg="RAGAS eval gate INACTIVE: no data/eval/ragas_baseline.json committed (see docs/training-and-evaluation.md)."
            echo "::warning title=Eval gate inactive::$msg"
            echo "⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          pip install -e .
          pip install -r requirements.txt
          pip install ragas

      - name: Run RAGAS eval
        if: steps.check.outputs.exists == 'true'
        env:
          BM25_INDEX_PATH: ${{ secrets.BM25_INDEX_PATH }}
          BM25_CORPUS_PATH: data/corpus.jsonl
          RETRIEVAL_BACKEND: local
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.internal.retrieval.ragas_eval \
            --dataset data/eval/ragas_qa.jsonl \
            --metrics faithfulness answer_relevancy \
            --output /tmp/ragas_current.json \
            --baseline data/eval/ragas_baseline.json

  intent-routing-gate:
    name: Intent Routing Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the category step reads round one's examples from ebd01873.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
          cache: pip

      # The encoder is ~130MB and the install pulls torch. Both are why this
      # lives here rather than in the fast unit-test lane, which deliberately
      # excludes heavy ML packages (see requirements-unit-test.txt).
      - name: Cache HuggingFace models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-e5-small-v2

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt

      # Everything this gate needs is committed: the canonical set, the
      # evaluation queries, and the out-of-scope probes. The index is a
      # gitignored artifact regenerable from them, so unlike the retrieval and
      # RAGAS gates above there is no baseline to commit and no secret to set —
      # this gate is active from its first run.
      - name: Build the intent index
        run: |
          python -m src.model.pre_training.intents.cli build \
            --canonical data/intent_canonical.json \
            --output data/intent_index

      # Automatic category selection (domains: ["auto"]) shares the encoder, so
      # it is measured here. Two one-time results are re-run, each into /tmp so
      # the committed reports are never rewritten, and neither bar is enforced:
      # drift from the committed numbers is a warning.
      # - Round one (data/eval/category_selection.json, coverage 0.729, bar
      #   missed) is re-run with the parameters and examples it was measured
      #   with: (3, 0.0), pinned because the defaults have since changed, and
      #   the 160 examples as merged in #689 (ebd01873, on main; the checkout
      #   fetches full history so that commit is available).
      # - v2 (data/eval/category_selection_v2.json, bar passed) is re-run with
      #   the current examples and defaults on the frozen v2 test set.
      # Both leakage checks are enforced. Round one fails on any example within
      # e5 cosine 0.95 of a round-one eval query, except the two documented
      # pairs in LEAKAGE_ALLOWLIST; v2 checks the examples and the dev v2
      # queries against the v2 test set with no allowlist. Like the intent
      # bars, a missing encoder is a failure here, not a skip — these commands
      # import it and error out.
      - name: Build and evaluate the category index
        run: |
          git show ebd01873:data/category_examples.json > /tmp/category_examples_r1.json
          python -m src.model.pre_training.categories.cli build \
            --examples /tmp/category_examples_r1.json \
            --output /tmp/category_index_r1
          python -m src.model.pre_training.categories.cli evaluate \
            --index /tmp/category_index_r1 \
            --labels data/eval/source_category_queries.json \
            --top-k 3 --select-margin 0.0 \
            --report /tmp/category_selection.json
          python -m src.model.pre_training.categories.cli build \
            --examples data/category_examples.json \
            --output data/category_index
          python -m src.model.pre_training.categories.cli evaluate-v2 \
            --index data/category_index \
            --labels data/eval/category_selection_test_v2.json \
            --report /tmp/category_selection_v2.json
          python - <<'EOF'
          import json, os
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          r = json.load(open("/tmp/category_selection.json"))
          line = (
              f"Category selection round one (test n={r['n']}): coverage {r['coverage']:.3f}, "
              f"mean picks {r['mean_picks']:.2f}, top-1 {r['top1']:.3f}; "
              f"bar {'met' if r['passed'] else 'MISSED'} (not enforced)"
          )
          print(line)
          summary.write(line + "\n")
          v = json.load(open("/tmp/category_selection_v2.json"))
          line = (
              f"Category selection v2 (test n={v['n']}): hit {v['hit']:.3f}, "
              f"precision {v['precision']:.3f}, mean picks {v['mean_picks']:.2f}, "
              f"top-1 {v['top1']:.3f}; bar {'met' if v['passed'] else 'MISSED'} "
              "(not enforced)"
          )
          print(line)
          summary.write(line + "\n")
          # Drift against the committed one-time results is a warning, not a
          # failure: the bars stay unenforced, the numbers should not move silently.
          checks = (
              ("round one", r, "data/eval/category_selection.json",
               ("coverage", "mean_picks", "top1")),
              ("v2", v, "data/eval/category_selection_v2.json",
               ("hit", "precision", "mean_picks")),
          )
          for name, now, path, keys in checks:
              committed = json.load(open(path))
              for key in keys:
                  if abs(now[key] - committed[key]) > 0.005:
                      print(
                          f"::warning::category selection {name} {key} drifted: "
                          f"{now[key]:.3f} now vs {committed[key]:.3f} committed"
                      )
          EOF

      - name: Category example leakage check
        run: |
          python -m src.model.pre_training.categories.cli leakage \
            --examples data/category_examples.json \
            --labels data/eval/source_category_queries.json
          python -m src.model.pre_training.categories.cli leakage \
            --examples data/category_examples.json \
            --dev data/eval/category_selection_dev_v2.json \
            --against data/eval/category_selection_test_v2.json

      # The latency bar is deliberately excluded. It measures wall-clock p95 for
      # one encode-and-decide, and the 25ms ceiling was set against real serving
      # hardware — a shared CI runner is 2-3x slower, so it fails on hardware
      # rather than on anything this gate is guarding. Its first run here
      # measured 29.0ms against 11.5ms on a developer machine, with no code
      # change between them. It stays pinned and enforced locally, where the
      # number means something. Every other bar here — accuracy, separability,
      # and the canonical-set invariants — is hardware-independent.
      - name: Run the pinned routing bars
        run: |
          python -m pytest \
            tests/unit/test_intent_evaluation.py \
            tests/unit/test_intent_canonical_data.py \
            --deselect tests/unit/test_intent_evaluation.py::test_routing_one_request_stays_under_the_latency_ceiling \
            -v --junitxml=/tmp/intent-bars.xml

      # The bars skip themselves when sentence-transformers or the index is
      # absent, so a job that merely runs them would stay green in exactly the
      # situation it exists to catch. A skip here means the environment is wrong,
      # which is a gate failure, not a pass. The count floor covers the other way
      # of measuring nothing: a deselect or a rename that quietly drops bars.
      - name: Fail if any bar skipped or went missing
        if: always()
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          # One below the count at the time of writing (21 after the latency bar
          # is deselected), so adding bars never trips it but losing one does.
          MINIMUM_BARS = 20

          tree = ET.parse("/tmp/intent-bars.xml")
          cases = list(tree.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]

          if skipped:
              print("::error title=Intent gate did not actually run::")
              for name in skipped:
                  print(f"  SKIPPED: {name}")
              print(
                  "\nThese bars skip when sentence-transformers or data/intent_index/ "
                  "is missing. A skip means the gate did not measure anything."
              )
              sys.exit(1)

          if len(cases) < MINIMUM_BARS:
              print("::error title=Intent gate lost bars::")
              print(
                  f"  Ran {len(cases)} bars, expected at least {MINIMUM_BARS}. "
                  "A deselect or a rename has dropped one; a gate that measures "
                  "less than it did yesterday is not a gate."
              )
              sys.exit(1)

          print(f"All {len(cases)} bars ran; none skipped.")
          EOF

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.11.9

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

  unit-tests:
    # Both ends of the supported range. pyproject declares requires-python
    # ">=3.10", and testing only 3.12 let three 3.11+/3.12-only constructs onto
    # main -- datetime.UTC, the asyncio.TimeoutError/builtin merge, and 3.12's
    # compensated sum() (#610). A static guard catches names that do not exist;
    # only running on the floor catches behaviour that differs.
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-unit-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short

  docker-context:
    name: Docker build context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds docker/Dockerfile.contract, which asserts the two things about
      # the image that unit tests cannot: that .dockerignore lets the corpus
      # through, and that the editable install registers the package rather
      # than relying on the working directory. Both of those shipped broken
      # (#622, #623) because nothing here ran a build. Skips requirements.txt,
      # so this is seconds rather than the minutes a full image costs.
      - name: Verify the image build context
        run: docker build -f docker/Dockerfile.contract --progress=plain .

  docker-image:
    name: Docker image (full build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No disk reclaim step. The job's first run measured 87G available before
      # any cleanup and 110G after, against a 7.64GB image -- the ~54s it cost
      # bought nothing. The local build that ran out of space did so at 11GiB
      # free on a laptop, a constraint mistaken for a general one. Add it back
      # when runner disk pressure is measurable rather than anticipated.
      - name: Build the application image
        run: docker build -t agentic-search:ci .
      # A build proves the layers resolve; it does not prove the app imports.
      # uvicorn is not started here -- the web app's lifespan loads a model and
      # wants Postgres/Redis. Importing the ASGI module is the part a build can
      # honestly check.
      - name: Import the ASGI app inside the image
        run: |
          docker run --rm agentic-search:ci \
            python -c "import src.internal.servers.web.app as m; print('imported', m.__name__)"
      # Guards the CPU-only torch install in the Dockerfile: if a later
      # dependency change pulls the default linux wheel, the CUDA stack returns
      # and the image doubles. Cheap to assert, invisible otherwise.
      - name: Assert the image carries no CUDA wheels
        run: |
          if docker run --rm agentic-search:ci pip list --format=freeze \
               | grep -iE '^(nvidia|cuda-|triton)'; then
            echo "FAIL: CUDA packages in a CPU-only serving image (see Dockerfile)"
            exit 1
          fi
          echo "OK: no nvidia/cuda/triton packages in the image"
      - name: Report image size
        run: docker image ls agentic-search:ci

  docker-compose:
    name: Docker compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The last unvalidated part of the packaging story. `Docker image (full
      # build)` proves the image builds and the ASGI module imports; nothing so
      # far has started the stack. Three claims about this file were wrong
      # before anyone ran it (#622-#624), so it gets run.
      #
      # --wait blocks on the healthchecks compose already declares, so a service
      # that starts and then dies fails here rather than passing silently.
      - name: Bring the stack up
        run: |
          docker compose -f docker/docker-compose.yml up -d --build \
            --wait --wait-timeout 420
      # Asserted separately from --wait: a healthcheck runs inside the container
      # and says nothing about the published port actually serving.
      - name: Probe both services on their published ports
        run: |
          curl -fsS --retry 5 --retry-delay 3 http://localhost:7860/health
          echo
          curl -fsS --retry 5 --retry-delay 3 http://localhost:8000/health
          echo
      # The corpus is what #622/#623 were about; prove the retrieval service can
      # actually answer from it, not merely report itself healthy.
      - name: Retrieve from the corpus
        run: |
          curl -fsS -X POST http://localhost:8000/retrieve \
            -H 'content-type: application/json' \
            -d '{"queries":["vector search"],"topk":2}'
          echo
      # The non-root user has to be able to write AGENTIC_SEARCH_WEB_DB_PATH on
      # the app_data volume. A healthy web service already implies it -- the
      # store is opened during create_web_app() -- but assert the file to make
      # the reason a failure would appear here explicit.
      - name: The app owns its database on the volume
        run: |
          docker compose -f docker/docker-compose.yml exec -T web \
            sh -c 'id -u && ls -ln /data/agentic_search.db'
      - name: Stack state
        if: always()
        run: docker compose -f docker/docker-compose.yml ps
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=120
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

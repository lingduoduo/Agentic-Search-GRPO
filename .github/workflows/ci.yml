name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.11.9

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

  unit-tests:
    # Both ends of the supported range. pyproject declares requires-python
    # ">=3.10", and testing only 3.12 let three 3.11+/3.12-only constructs onto
    # main -- datetime.UTC, the asyncio.TimeoutError/builtin merge, and 3.12's
    # compensated sum() (#610). A static guard catches names that do not exist;
    # only running on the floor catches behaviour that differs.
    name: Python Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-unit-test.txt

      - name: Run unit tests
        run: pytest tests/unit/ -q --tb=short

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

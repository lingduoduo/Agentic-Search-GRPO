[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-search"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyJWT[crypto]>=2.10.1,<3", "tomli>=2.0.0; python_version < '3.11'"]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0",
    "httpx>=0.28.1,<1.0",
]
mcp-documents = [
    "pypdf>=6.12.2",
    "psutil>=5.9.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml"]

[tool.pytest.ini_options]
# Default run covers unit + regression tests only.
# Integration tests require a live server stack (Postgres, OpenSearch, Redis, etc.)
# and are opt-in:  pytest tests/integration/
testpaths = ["tests/unit", "tests/regression"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".understand-anything",
    "agentic_search.egg-info",
    "data",
    "indexes",
    "models",
    "web/dist",
    "web/node_modules",
]
# Add src/ to sys.path so shared_configs and other src-level packages are importable
# without the src. prefix (matching their package structure).
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "load: marks tests as load/performance tests",
    "integration: marks tests requiring a live server stack",
    "alembic: marks migration tests that exercise Alembic migration flows",
]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning:starlette\\.formparsers",
    "ignore:urllib3.*or chardet.*doesn't match a supported version",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated.*:DeprecationWarning",
]

# Full local stack for Agentic Search.
#
# Bring up infrastructure only:
#   docker compose -f docker/docker-compose.yml up postgres redis
#
# Bring up everything:
#   docker compose -f docker/docker-compose.yml up --build
#
# All service-to-service hostnames match the service names below.
# Override any value by creating a docker/docker-compose.override.yml or
# by setting environment variables before running docker compose.

x-app-env: &app-env
  # --- PostgreSQL ---
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: agentic_search
  POSTGRES_USER: agentic
  POSTGRES_PASSWORD: agentic_pass
  POSTGRES_POOL_RECYCLE: "3600"

  # --- Redis ---
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  REDIS_USE_SSL: "False"

  # --- Celery (uses Redis DB 1) ---
  CELERY_BROKER_DB: "1"
  CELERY_RESULT_BACKEND_DB: "1"
  CELERY_TASK_IGNORE_RESULT: "False"
  CELERY_RESULT_EXPIRES: "3600"
  CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "True"

  # --- LLM (override with real keys in .env) ---
  GEN_AI_MODEL_PROVIDER: openai
  GEN_AI_MODEL_VERSION: gpt-4o-mini
  GEN_AI_API_KEY: ""
  GEN_AI_MAX_INPUT_TOKENS: "8192"

  # --- Services ---
  AGENTIC_SEARCH_RETRIEVAL_URL: http://retrieval:8000/retrieve
  AGENTIC_SEARCH_WEB_DB_PATH: /data/agentic_search.db
  AGENTIC_SEARCH_WEB_PORT: "7860"
  ENABLE_OPENSEARCH_INDEXING: "False"

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_search
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_search"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  retrieval:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    # The corpus is read from the image, not from the app_data volume: that
    # volume mounts over /data and would shadow anything baked there. /data
    # stays for writable state (the sqlite DB below).
    command: >
      python -m src.internal.servers.retrieval.demo
      --corpus_path /app/data/corpus.jsonl
      --host 0.0.0.0
      --port 8000
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - app_data:/data
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - agentic_search_default

volumes:
  postgres_data:
  redis_data:
  app_data:

networks:
  agentic_search_default:
    name: agentic_search_default
